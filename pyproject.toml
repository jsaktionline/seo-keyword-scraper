[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-keyword-scraper"
version = "1.0.0"
description = "CLI tool that fetches Google autocomplete keyword suggestions and exports them to CSV or JSON."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
]

[project.scripts]
kwscraper = "kwscraper.cli:main"

[tool.setuptools.packages.find]
include = ["kwscraper"]
